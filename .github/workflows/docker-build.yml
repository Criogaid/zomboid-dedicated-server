name: Test server image

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zomboid-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve current stable metadata
        id: metadata
        run: python3 scripts/resolve-version.py --github-output "$GITHUB_OUTPUT"

      - name: Run static tests
        run: scripts/test.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/zomboid-dedicated-server.Dockerfile
          platforms: linux/amd64
          load: true
          tags: zomboid-dedicated-server:test
          build-args: |
            PZ_VERSION=${{ steps.metadata.outputs.version }}
            STEAM_BUILD_ID=${{ steps.metadata.outputs.build_id }}
            LINUX_MANIFEST_ID=${{ steps.metadata.outputs.manifest_id }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=zomboid-amd64
          cache-to: type=gha,mode=max,scope=zomboid-amd64

      - name: Verify image contract
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Architecture}}' zomboid-dedicated-server:test)" = "amd64"
          test "$(docker image inspect --format '{{.Config.User}}' zomboid-dedicated-server:test)" = "steam"
          LABELS=$(docker image inspect --format '{{json .Config.Labels}}' zomboid-dedicated-server:test)
          test "$(jq -r '."org.opencontainers.image.version"' <<< "$LABELS")" = "${{ steps.metadata.outputs.version }}"
          test "$(jq -r '."io.criogaid.zomboid.steam-build-id"' <<< "$LABELS")" = "${{ steps.metadata.outputs.build_id }}"
          test "$(jq -r '."io.criogaid.zomboid.linux-manifest-id"' <<< "$LABELS")" = "${{ steps.metadata.outputs.manifest_id }}"
