services:
  zomboid-dedicated-server:
    platform: linux/amd64
    image: docker.io/criogaid/zomboid-dedicated-server:latest
    build:
      context: .
      dockerfile: docker/zomboid-dedicated-server.Dockerfile
    container_name: zomboid-dedicated-server
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your environment or .env file}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      AUTOSAVE_INTERVAL:
      DEFAULT_PORT:
      GAME_VERSION: "${GAME_VERSION:-public}"
      GC_CONFIG: "${GC_CONFIG:-ZGC}"
      MAP_NAMES:
      MAX_PLAYERS:
      MAX_RAM: "${MAX_RAM:-4096m}"
      MOD_NAMES:
      MOD_WORKSHOP_IDS:
      PAUSE_ON_EMPTY:
      PUBLIC_LISTED:
      PUBLIC_SERVER:
      SERVER_NAME: "${SERVER_NAME:-ZomboidServer}"
      SERVER_PASSWORD:
      STEAM_VAC: "${STEAM_VAC:-true}"
      UDP_PORT:
      UPDATE_ON_START: "${UPDATE_ON_START:-true}"
      USE_STEAM: "${USE_STEAM:-true}"
      VALIDATE_FILES: "${VALIDATE_FILES:-true}"
      TZ: "${TZ:-UTC}"
    ports:
      - "${DEFAULT_PORT:-16261}:${DEFAULT_PORT:-16261}/udp"
      - "${UDP_PORT:-16262}:${UDP_PORT:-16262}/udp"
    volumes:
      - ./ZomboidDedicatedServer:/home/steam/ZomboidDedicatedServer
      - ./ZomboidConfig:/home/steam/Zomboid
